<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Danh sách phản ánh</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/chatbot.css">
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light custom-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">FieldReport AI</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav ms-auto gap-lg-4">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Trang chủ</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="reports.html">Phản ánh</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="report.html">Gửi phản ánh</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <section class="category-page-header">
    <div class="container">
      <a href="index.html" class="back-link">← Quay lại trang chủ</a>

      <h1 id="categoryTitle">Danh sách phản ánh</h1>

      <p id="categoryDesc">
        Các phản ánh được phân loại theo danh mục đã chọn.
      </p>
    </div>
  </section>

  <!-- REPORT LIST -->
  <section class="report-section">
    <div class="container">
      <div class="row g-4" id="reportList">
        <!-- JS sẽ tự render danh sách ở đây -->
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/main.js"></script>

  <!-- Chatbot floating widget -->
<button class="chatbot-toggle" onclick="toggleChatbot()">💬</button>

<div class="chatbot-box" id="chatbotBox">
    <div class="chatbot-header">
        <span>ReportBot - Hỗ trợ phản ánh</span>
        <button class="chatbot-close" onclick="toggleChatbot()">×</button>
    </div>

    <div class="chatbot-messages" id="chatbotMessages">
        <div class="chat-message bot-message">
            Xin chào! Tôi là ReportBot. Bạn có thể gửi phản ánh hoặc tra cứu trạng thái phản ánh tại đây.
        </div>
    </div>

    <div class="chatbot-suggestions">
        <button onclick="sendSuggestion('Tôi muốn gửi phản ánh')">Gửi phản ánh</button>
        <button onclick="askReportCode()">Tra cứu mã</button>
        <button onclick="askReportLocation()">Tra cứu địa điểm</button>
        <button onclick="sendCurrentLocationToChat()">📍 Gửi vị trí</button>
        <button onclick="document.getElementById('chatImageInput').click()">🖼️ Thêm ảnh</button>
    </div>
    <input
    type="file"
    id="chatImageInput"
    accept="image/*"
    style="display: none;"
    onchange="handleChatImageUpload(event)"
>

<div id="chatImageStatus" style="font-size: 13px; padding: 0 12px 8px; color: #555;"></div>
    <div class="chatbot-input-area">
        <input type="text" id="chatbotInput" placeholder="Nhập tin nhắn..." />
        <button onclick="sendChatMessage()">Gửi</button>
    </div>
</div>
<script src="js/chatbot.js?v=999"></script>
</body>
</html>
